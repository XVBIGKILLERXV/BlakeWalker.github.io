<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 // Blake Walker</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      width: 100%;
      min-height: 100%;

      background: #09050f;

      color: #f4edf9;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at 50% 40%,
          #1d0b30 0%,
          #09050f 58%
        );

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    .error {
      width: min(760px, 100%);
    }

    .code {
      margin-bottom: 25px;

      font-family: monospace;
      font-size: 11px;

      letter-spacing: 0.3em;

      color: #a995b8;
    }

    h1 {
      margin: 0;

      font-size: clamp(55px, 11vw, 130px);
      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.055em;
    }

    .message {
      margin-top: 40px;

      max-width: 430px;

      font-family: monospace;
      font-size: 11px;

      line-height: 1.8;

      letter-spacing: 0.08em;

      color: #a995b8;
    }

    a {
      display: inline-block;

      margin-top: 35px;

      color: #c49aff;

      font-family: monospace;
      font-size: 11px;

      letter-spacing: 0.14em;

      text-decoration: none;
    }

    a:hover {
      color: #ffffff;
    }

  </style>

</head>


<body>

  <main class="error">

    <div class="code">
      ERROR / 404
    </div>

    <h1>
      YOU'VE GONE<br>
      TOO FAR.
    </h1>

    <div class="message">

      The thing you're looking for doesn't exist here.

      <br><br>

      PATH / UNKNOWN<br>
      STATUS / LOST<br>
      SYSTEM / ONLINE

    </div>

    <a href="/">
      &gt; RETURN_HOME
    </a>

  </main>

</body>

</html>
